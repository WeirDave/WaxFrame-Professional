name = "waxframe-claude-proxy"
main = "src/index.js"
compatibility_date = "2026-04-14"

[[ratelimits]]
name = "REQUEST_RATE_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 120
period = 60

# No KV, secrets, or environment variables. REQUEST_RATE_LIMITER limits each
# hashed caller key to 120 requests/minute per Cloudflare location. The raw
# Anthropic API key is forwarded per request and is never stored server-side.
#
# Served on the default *.workers.dev subdomain only — no custom route or
# domain configured (confirmed via the /subdomain endpoint at import time).
