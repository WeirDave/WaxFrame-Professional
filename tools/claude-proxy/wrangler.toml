name = "waxframe-claude-proxy"
main = "src/index.js"
compatibility_date = "2026-04-14"

[[ratelimits]]
name = "REQUEST_RATE_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 120
period = 60

# Second limiter, keyed on CF-Connecting-IP (hashed). REQUEST_RATE_LIMITER is
# keyed on the API key, which a caller can change on every request; this one
# caps a single address regardless. Higher than the per-key limit so several
# people behind one office/NAT address are not throttled together. Rate-limit
# namespace ids are chosen by us, not provisioned: this needs no new resource.
[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1003"

[ratelimits.simple]
limit = 300
period = 60

# No KV, secrets, or environment variables. REQUEST_RATE_LIMITER limits each
# hashed caller key to 120 requests/minute per Cloudflare location. The raw
# Anthropic API key is forwarded per request and is never stored server-side.
#
# Served on the default *.workers.dev subdomain only — no custom route or
# domain configured (confirmed via the /subdomain endpoint at import time).
