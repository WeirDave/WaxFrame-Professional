name: One-shot release v3.63.461

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-release-v3.63.461.yml'

permissions:
  contents: write
  actions: write
  pages: write

jobs:
  prepare-release:
    if: startsWith(github.event.head_commit.message, 'release-bootstrap: v3.63.461')
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare v3.63.461 release surfaces
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const OLD_VERSION = '3.63.460';
          const NEW_VERSION = '3.63.461';
          const OLD_BUILD = '20260814-001';
          const NEW_BUILD = '20260815-001';
          const ROOT = process.cwd();

          function read(p) { return fs.readFileSync(path.join(ROOT, p), 'utf8'); }
          function write(p, s) { fs.writeFileSync(path.join(ROOT, p), s, 'utf8'); }
          function walk(dir, pred) {
            const out = [];
            for (const ent of fs.readdirSync(path.join(ROOT, dir), { withFileTypes: true })) {
              if (['.git', 'node_modules', 'release-artifacts'].includes(ent.name)) continue;
              const rel = path.join(dir, ent.name);
              if (ent.isDirectory()) out.push(...walk(rel, pred));
              else if (pred(rel)) out.push(rel);
            }
            return out;
          }

          // js/version.js — canonical public version and build.
          {
            let s = read('js/version.js');
            s = s.replace(/(\/\/\s*Build:\s*)\d{8}-\d{3}/, `$1${NEW_BUILD}`);
            s = s.replace(/(const\s+APP_VERSION\s*=\s*['"]v?)3\.63\.460(\s+Pro['"])/, `$1${NEW_VERSION}$2`);
            write('js/version.js', s);
          }

          // Every shipped JS module gets the same build header. app.js also
          // owns a runtime BUILD constant used in diagnostics.
          for (const rel of walk('js', p => p.endsWith('.js'))) {
            let s = read(rel);
            s = s.replace(/(\/\/\s*Build:\s*)\d{8}-\d{3}/, `$1${NEW_BUILD}`);
            if (rel.replace(/\\/g, '/') === 'js/app.js') {
              s = s.replace(/(const\s+BUILD\s*=\s*['"])\d{8}-\d{3}(['"])/, `$1${NEW_BUILD}$2`);
            }
            write(rel, s);
          }

          // Every HTML page: header build, browser-visible build meta, and
          // all cache-bust query strings. index.html also carries JSON-LD.
          for (const rel of walk('.', p => p.endsWith('.html'))) {
            let s = read(rel);
            s = s.replace(/(<!--[\s\S]*?\bBuild:\s*)\d{8}-\d{3}/, `$1${NEW_BUILD}`);
            s = s.replace(/(<meta\s+name="waxframe-build"\s+content=")\d{8}-\d{3}(")/g, `$1${NEW_BUILD}$2`);
            s = s.replace(/\?v=3\.63\.460\b/g, `?v=${NEW_VERSION}`);
            if (rel.replace(/\\/g, '/') === 'index.html') {
              s = s.replace(/("softwareVersion"\s*:\s*")3\.63\.460(")/, `$1${NEW_VERSION}$2`);
            }
            write(rel, s);
          }

          // CSS build stamp.
          {
            let s = read('style.css');
            s = s.replace(/(Build:\s*)\d{8}-\d{3}/, `$1${NEW_BUILD}`);
            write('style.css', s);
          }

          // npm/package version.
          {
            const pkg = JSON.parse(read('package.json'));
            pkg.version = NEW_VERSION;
            write('package.json', JSON.stringify(pkg, null, 2) + '\n');
          }

          // CHANGELOG: insert the release immediately after its H1 heading.
          {
            const p = 'CHANGELOG.md';
            let s = read(p);
            const entry = [
              `## v${NEW_VERSION} — Hosted Server Mode origin guidance`,
              `**Released:** 2026-08-15  `,
              `**Build:** ${NEW_BUILD}`,
              '',
              '- Added hosted Server Mode guidance that detects the current WaxFrame origin and shows the exact origin to allow for Ollama, LM Studio, or OpenWebUI CORS settings.',
              '- Added Local Network Access guidance for Chromium-based browsers when a hosted WaxFrame page connects to localhost or LAN model servers.',
              '- Clarified that prompts and documents still travel directly from the browser to the selected local/LAN model server; GitHub or website hosting only serves the WaxFrame frontend.',
              '- Kept existing Server-mode eligibility, model selection, API calls, storage, Builder logic, and round execution unchanged.',
              '',
              ''
            ].join('\n');
            const h1 = s.match(/^#.*$/m);
            if (h1) {
              const at = h1.index + h1[0].length;
              s = s.slice(0, at) + '\n\n' + entry + s.slice(at).replace(/^\s*/, '\n');
            } else {
              s = entry + s;
            }
            write(p, s);
          }

          // Backlog is versioned on every release; released work belongs in
          // CHANGELOG, not the backlog. This change was reactive, so there is
          // no open backlog item to remove.
          {
            const oldP = 'docs/WaxFrame_Backlog_Master_v273.txt';
            const newP = 'docs/WaxFrame_Backlog_Master_v274.txt';
            let s = read(oldP);
            s = s.replace(/^WaxFrame Backlog Master v273/m, 'WaxFrame Backlog Master v274');
            s = s.replace(/^2026-08-13$/m, '2026-08-15');
            fs.writeFileSync(path.join(ROOT, newP), s, 'utf8');
            fs.unlinkSync(path.join(ROOT, oldP));
          }

          // The bootstrap workflow is intentionally disposable; delete it
          // from the release commit so main stays clean.
          fs.unlinkSync(path.join(ROOT, '.github/workflows/one-shot-release-v3.63.461.yml'));

          console.log(`Prepared v${NEW_VERSION} / build ${NEW_BUILD}`);
          NODE

      - name: Run release validator
        run: node tools/release-check.mjs

      - name: Run browser smoke test
        run: node tools/smoke-app-headless.mjs

      - name: Commit coherent release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "v3.63.461 — Hosted Server Mode origin guidance" \
            -m "Show the exact hosted WaxFrame origin and explain CORS / Local Network Access requirements for localhost and LAN model servers.\n\nWhy: a hosted WaxFrame page needs browser and model-server origin permission even though the AI workload and documents remain local."
          git push origin HEAD:main

      - name: Run official Release Check workflow on release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-check.yml --ref main

      - name: Request fresh GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
